<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <script>window.downloadFile = (fileName, contentStream) => {
        const url = URL.createObjectURL(contentStream);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
    };</script>
</body>
</html>
